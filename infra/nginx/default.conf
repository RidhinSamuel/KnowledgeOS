# Upgrade the connection only when the client asks for it (Vite HMR websocket)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name localhost;

    # Max upload size limit
    client_max_body_size 50M;

    # SSE chat streaming route (regex locations win over the /api/ prefix below)
    location ~ ^/api/v1/chat/session/[^/]+/stream$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Critical settings for SSE (Server-Sent Events) streaming
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy backend API requests
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Uploads trigger parsing; give the backend time to answer
        proxy_read_timeout 300s;
    }

    # Proxy OpenAPI docs and health check
    location = /docs {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }
    location = /healthz {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Everything else goes to the Vite dev server (including the HMR websocket)
    location / {
        proxy_pass http://frontend:5173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
